<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BA Interview Prep Master</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --success: #27ae60;
            --warning: #f1c40f;
            --light: #ecf0f1;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        /* Header & Progress */
        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .progress-container {
            background-color: rgba(255,255,255,0.2);
            height: 10px;
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            background-color: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 0.9em;
            margin-top: 5px;
            opacity: 0.9;
        }

        /* Card Content */
        .card-content {
            padding: 30px;
            min-height: 400px;
        }

        .tag {
            display: inline-block;
            background: var(--light);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-title {
            font-size: 1.5em;
            color: var(--primary);
            margin-bottom: 25px;
            font-weight: 700;
        }

        /* Interaction Area */
        .reveal-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
            display: block;
            margin: 0 auto;
        }

        .reveal-btn:hover {
            background: #34495e;
        }

        .answer-area {
            display: none; /* Hidden by default */
            margin-top: 25px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Framework Styling */
        .framework-box {
            border-left: 4px solid var(--accent);
            padding-left: 20px;
            margin-bottom: 20px;
        }

        .step {
            margin-bottom: 8px;
        }

        .step strong {
            color: var(--accent);
        }

        .tip-box {
            background: #fff3cd;
            border-left: 4px solid var(--warning);
            padding: 15px;
            margin: 15px 0;
            font-size: 0.95em;
        }

        .example-box {
            background: #e8f5e9;
            border-left: 4px solid var(--success);
            padding: 15px;
            margin: 15px 0;
            font-size: 0.95em;
        }

        .avoid-box {
            background: #ffebee;
            border-left: 4px solid var(--accent);
            padding: 15px;
            margin: 15px 0;
            font-size: 0.95em;
        }

        /* Navigation Footer */
        .footer {
            background: #f8f9fa;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #eee;
        }

        .nav-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: var(--primary);
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #eee;
        }

        .nav-btn.primary {
            background: var(--accent);
            color: white;
            border: none;
        }

        .nav-btn.primary:hover {
            background: #c0392b;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Celebration */
        .celebration {
            text-align: center;
            display: none;
            padding: 40px;
        }
        .celebration h2 { color: var(--success); }

    </style>
</head>
<body>

    <div class="container" id="quiz-container">
        <div class="header">
            <h1>BA Interview Prep Wizard</h1>
            <div class="progress-text" id="progress-text">Question 1 of 15</div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="card-content" id="card-content">
            </div>

        <div class="footer">
            <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">← Previous</button>
            <button class="nav-btn primary" id="next-btn" onclick="nextQuestion()">Next Question →</button>
        </div>
    </div>

    <div class="container celebration" id="end-screen">
        <h2>🎉 Amazing Job! 🎉</h2>
        <p>You have completed the entire interview preparation framework.</p>
        <p>Take a deep breath. You are ready.</p>
        <button class="nav-btn primary" onclick="location.reload()">Start Over</button>
    </div>

    <script>
        // Data Structure with Enhanced Questions
        const questions = [
            {
                category: "Behavioral",
                title: "Tell me about yourself / Walk me through your resume",
                framework: [
                    "<strong>Step 1: The Hook (Current Role):</strong> 'I am currently a [Role] at [Company] where I focus on [Key Responsibility]...'",
                    "<strong>Step 2: The Journey (Past):</strong> 'Prior to this, I worked at [Previous Company] where I developed my skills in [Skill 1 & Skill 2]...'",
                    "<strong>Step 3: The Win (Achievement):</strong> 'A highlight of my career was leading a project that saved 20% in operational costs...'",
                    "<strong>Step 4: The Goal (Why Here):</strong> 'I'm looking to move to [Target Company] because I want to apply these skills to your [Specific Project/Industry].'"
                ],
                tip: "Keep it under 2 minutes. Do not recite your bio data. Frame your story around the skills needed for THIS job.",
                example: "I'm currently a BA at TechCorp specializing in data migration. I've led 3 successful CRM integrations. I'm excited about this role because I can bring that migration expertise to your upcoming cloud transformation.",
                avoid: "Starting with 'I was born in...' or listing every single job duty you've ever had."
            },
            {
                category: "Technical",
                title: "How do you gather requirements from stakeholders?",
                framework: [
                    "<strong>Step 1: Preparation:</strong> 'I start by analyzing existing documentation and identifying key stakeholders.'",
                    "<strong>Step 2: Selection of Techniques:</strong> 'I choose techniques based on the audience. I use <em>Interviews</em> for executives, <em>Workshops</em> for cross-functional consensus, and <em>Observation</em> for end-users.'",
                    "<strong>Step 3: Documentation & Validation:</strong> 'I document these in user stories or BRDs and always loop back for sign-off.'"
                ],
                tip: "Don't just list techniques (Interviews, Surveys, JAD). Explain WHY you choose one over the other.",
                example: "In my last project, stakeholders were in different time zones, so I used surveys for initial data and focused workshops for conflict resolution.",
                avoid: "Saying 'I just ask them what they want'. It implies you are an order taker, not an analyst."
            },
            {
                category: "Situational",
                title: "How do you handle conflicting requirements?",
                framework: [
                    "<strong>Situation:</strong> 'On Project X, Marketing wanted Feature A (Speed) while Compliance needed Feature B (Security) which slowed it down.'",
                    "<strong>Task:</strong> 'I needed to find a middle ground without delaying the launch.'",
                    "<strong>Action:</strong> 'I facilitated a meeting, presented the data/impact of both options, and proposed a phased approach.'",
                    "<strong>Result:</strong> 'We agreed to launch with high security first, and optimize speed in Sprint 2. Both stakeholders felt heard.'"
                ],
                tip: "Use the word 'Facilitate' and 'Trade-offs'. You are the bridge builder.",
                example: "I use data to remove emotion from the decision. I show the impact of A vs B on the timeline and budget.",
                avoid: "Saying 'I let the Project Manager decide' or 'I picked the one I liked more'."
            },
            {
                category: "Technical",
                title: "Functional vs Non-Functional Requirements?",
                framework: [
                    "<strong>Step 1: Definition:</strong> 'Functional is WHAT the system does (Features). Non-Functional is HOW the system behaves (Quality).'",
                    "<strong>Step 2: The Mental Check:</strong> 'I often use the acronym URPS+ (Usability, Reliability, Performance, Supportability) for Non-functional.'",
                    "<strong>Step 3: Real Example:</strong> 'Functional: The button calculates tax. Non-Functional: The calculation happens in under 1 second.'"
                ],
                tip: "Interviewers love hearing about Performance, Security, and Scalability. Don't forget them.",
                example: "In an e-commerce app, 'Add to Cart' is functional. 'The site handles 10,000 users on Black Friday' is non-functional.",
                avoid: "Confusing the two. If you mix them up, it's an immediate red flag."
            },
            {
                category: "Process",
                title: "Explain your experience with Agile/Scrum",
                framework: [
                    "<strong>Step 1: Your Role:</strong> 'I act as the proxy for the Product Owner, refining the backlog.'",
                    "<strong>Step 2: Artifacts:</strong> 'I write User Stories with Gherkin (Given/When/Then) Acceptance Criteria.'",
                    "<strong>Step 3: Ceremonies:</strong> 'I actively participate in Standups, Sprint Planning, and lead the Backlog Refinement sessions.'"
                ],
                tip: "Mention 'Backlog Grooming' or 'Refinement'. That is where the BA shines most in Agile.",
                example: "I ensure stories meet the INVEST criteria (Independent, Negotiable, Valuable, Estimable, Small, Testable) before sprint planning.",
                avoid: "Saying you 'Wait for instructions'. In Agile, the BA must be proactive."
            },
            {
                category: "Situational",
                title: "How do you handle Scope Creep?",
                framework: [
                    "<strong>Step 1: Define it:</strong> 'Uncontrolled changes or growth in project scope.'",
                    "<strong>Step 2: Prevention:</strong> 'I prevent it by having a clear, signed-off scope baseline and detailed requirements.'",
                    "<strong>Step 3: Management:</strong> 'If a new request comes in, I perform an Impact Analysis (Cost/Time).'",
                    "<strong>Step 4: The Process:</strong> 'I present this to the Change Control Board (CCB) or Product Owner to decide: Do we add this and drop something else?'"
                ],
                tip: "You don't just say NO. You say, 'Yes, but here is the cost.' Let the business decide if it's worth the delay.",
                example: "When a stakeholder asked for an extra report, I showed it would delay testing by 3 days. They decided to move it to Phase 2.",
                avoid: "Saying 'I am flexible so I just add it in.' That leads to project failure."
            },
            {
                category: "Technical",
                title: "How do you approach a new project from scratch?",
                framework: [
                    "<strong>Phase 1: Discovery:</strong> 'Identify stakeholders and understand the Business Case (Why are we doing this?).'",
                    "<strong>Phase 2: Elicitation:</strong> 'Gather requirements using workshops/interviews.'",
                    "<strong>Phase 3: Analysis:</strong> 'Prioritize requirements and create Process Flows (Current State vs Future State).'",
                    "<strong>Phase 4: Documentation:</strong> 'Create User Stories or BRD.'",
                    "<strong>Phase 5: Support:</strong> 'Support Dev and QA through testing and UAT.'"
                ],
                tip: "Mention 'Current State (As-Is)' vs 'Future State (To-Be)'. This gap analysis is the core of your job.",
                example: "I always start by asking 'What problem are we trying to solve?' before writing a single requirement.",
                avoid: "Skipping the 'Why'. Don't just start writing requirements without understanding the business goal."
            },
            {
                category: "Situational",
                title: "Tell me about a time a project failed or faced challenges.",
                framework: [
                    "<strong>Situation:</strong> 'We missed a deadline because a 3rd party API wasn't ready.'",
                    "<strong>Action:</strong> 'I shouldn't have assumed it would be ready. I learned to validate dependencies early.'",
                    "<strong>The Fix:</strong> 'I flagged the risk immediately, updated the project plan, and we descaled the feature to launch a manual workaround temporarily.'",
                    "<strong>Lesson:</strong> 'Now, I always create a dependency map at the start of any project.'"
                ],
                tip: "Own the mistake (or the challenge) but pivot quickly to the Solution and the Lesson Learned.",
                example: "I once missed a requirement because I didn't interview the end-user, only the manager. I learned to always talk to the actual people doing the work.",
                avoid: "Blaming developers or stakeholders entirely. It shows a lack of ownership."
            },
            {
                category: "Technical",
                title: "How do you prioritize requirements?",
                framework: [
                    "<strong>Technique 1: MoSCoW:</strong> 'Must have, Should have, Could have, Won't have.'",
                    "<strong>Technique 2: Business Value vs Complexity:</strong> 'I focus on High Value / Low Effort items first (Low hanging fruit).'",
                    "<strong>The Facilitation:</strong> 'I bring stakeholders together and force a ranking. Everything cannot be Priority 1.'"
                ],
                tip: "Mention 'MVP' (Minimum Viable Product). Prioritization is about getting the MVP out the door.",
                example: "I use a matrix on a whiteboard and have stakeholders stick features in quadrants. It makes the decision visual and collaborative.",
                avoid: "Saying 'I decide what is important.' The Business decides value; IT decides effort; You facilitate the trade-off."
            },
            {
                category: "Technical",
                title: "What tools and diagrams do you use?",
                framework: [
                    "<strong>Tools:</strong> 'JIRA/Azure DevOps for tracking, Confluence for documentation, Visio/LucidChart for diagrams.'",
                    "<strong>Diagrams:</strong> 'Process Flow (Swimlanes) to show responsibilities. Use Case Diagrams for system scope. Wireframes for UI visualization.'",
                    "<strong>Data:</strong> 'I also use SQL for basic data analysis and Excel for data mapping.'"
                ],
                tip: "Mentioning SQL is a huge plus in modern interviews. Even basic knowledge helps.",
                example: "If requirements are complex, I draw a Swimlane diagram. It instantly clarifies who does what.",
                avoid: "Listing tools you don't actually know. If they ask follow-up questions, you will be stuck."
            },
            {
                category: "Behavioral",
                title: "How do you handle difficult stakeholders?",
                framework: [
                    "<strong>Step 1: Empathy:</strong> 'I try to understand the root cause of their behavior. Are they afraid of losing control? Are they overworked?'",
                    "<strong>Step 2: One-on-One:</strong> 'I take the conversation offline (out of the big meeting) to listen to them.'",
                    "<strong>Step 3: Data-Driven:</strong> 'I use facts and data to counter opinions, while remaining respectful.'"
                ],
                tip: "The 'Difficult Stakeholder' is usually just a 'Passionate Stakeholder' who feels unheard.",
                example: "I had a stakeholder who refused to sign off. I sat with him, realized he didn't understand the tech, simplified the explanation, and got the sign-off.",
                avoid: "Badmouthing them. Never say 'They were just being irrational.'"
            },
            {
                category: "Technical",
                title: "Explain a complex concept (like an API) simply.",
                framework: [
                    "<strong>Concept:</strong> API (Application Programming Interface).",
                    "<strong>Analogy:</strong> 'It is like a Waiter in a restaurant.'",
                    "<strong>Explanation:</strong> 'You (the User) are at the table. The Kitchen (the Server/Database) has the food. You don't go into the kitchen. The Waiter (API) takes your order, delivers it to the kitchen, and brings your food back.'",
                    "<strong>Why it matters:</strong> 'It allows systems to talk to each other securely.'"
                ],
                tip: "Use analogies: Cloud = Rental Storage unit. Database = Electronic Filing Cabinet.",
                example: "I explain technical constraints to business users by comparing software development to building a house. You can't put the roof on before the foundation.",
                avoid: "Using more jargon to explain jargon."
            },
            {
                category: "Technical",
                title: "How do you ensure requirements are accurate (Traceability)?",
                framework: [
                    "<strong>Step 1: RTM:</strong> 'I use a Requirement Traceability Matrix (RTM).'",
                    "<strong>Step 2: The Link:</strong> 'It links Business Goal -> Requirement -> Test Case.'",
                    "<strong>Step 3: UAT:</strong> 'I ensure the User Acceptance Testing (UAT) actually tests the original business need, not just the code.'"
                ],
                tip: "Traceability is the BA's safety net. It proves that what was asked for is what was tested.",
                example: "In a previous project, the RTM helped us catch a missing test case for a critical payment feature before go-live.",
                avoid: "Saying 'I just remember what we discussed.'"
            },
            {
                category: "Behavioral",
                title: "Why should we hire you?",
                framework: [
                    "<strong>Component 1: Experience:</strong> 'I have the track record of delivering projects like X...'",
                    "<strong>Component 2: Soft Skills:</strong> 'I bridge the gap between technical and non-technical teams effortlessly.'",
                    "<strong>Component 3: Culture Fit:</strong> 'I thrive in [Company Culture] environments and I'm ready to hit the ground running.'",
                    "<strong>Component 4: The Closer:</strong> 'I am not just looking for a job, I want to solve [Specific Company Problem].'"
                ],
                tip: "Connect the dots for them. Match your skills specifically to the bullet points in THEIR job description.",
                example: "You need someone who knows SQL and Healthcare. I have 4 years of exactly that. I can start contributing on Day 1.",
                avoid: "Generic answers like 'I work hard' or 'I am a perfectionist'."
            },
            {
                category: "Closing",
                title: "Do you have any questions for us?",
                framework: [
                    "<strong>Question 1 (Success):</strong> 'What does success look like in this role in the first 90 days?'",
                    "<strong>Question 2 (Team):</strong> 'How is the BA team structured here? Do we align to products or projects?'",
                    "<strong>Question 3 (Challenges):</strong> 'What is the biggest challenge the team is facing right now?'"
                ],
                tip: "Always have 3 questions prepared. It shows you are serious and intelligent.",
                example: "I love asking about the team culture. It helps me decide if I want to work there.",
                avoid: "Asking about salary or vacation in the first round. Or saying 'No questions, I'm good.'"
            }
        ];

        let currentQuestionIndex = 0;

        function renderQuestion(index) {
            const q = questions[index];
            const contentDiv = document.getElementById('card-content');
            
            // Format Framework Steps
            const frameworkHtml = q.framework.map(step => `<div class="step">${step}</div>`).join('');

            contentDiv.innerHTML = `
                <div class="tag">${q.category}</div>
                <div class="question-title">${index + 1}. ${q.title}</div>
                
                <button class="reveal-btn" onclick="toggleAnswer()">👁 Reveal Answer Framework</button>
                
                <div class="answer-area" id="answer-area">
                    <div class="framework-box">
                        <div style="color: var(--accent); font-weight:bold; margin-bottom:10px;">Answer Framework:</div>
                        ${frameworkHtml}
                    </div>
                    
                    <div class="tip-box">
                        <strong>💡 Pro Tip:</strong> ${q.tip}
                    </div>
                    
                    <div class="example-box">
                        <strong>✅ Good Example:</strong> "${q.example}"
                    </div>
                    
                    <div class="avoid-box">
                        <strong>❌ Avoid:</strong> ${q.avoid}
                    </div>
                </div>
            `;

            // Update Progress
            updateProgress();
            
            // Button States
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').innerText = index === questions.length - 1 ? "Finish" : "Next Question →";
        }

        function toggleAnswer() {
            const area = document.getElementById('answer-area');
            if (area.style.display === "block") {
                area.style.display = "none";
            } else {
                area.style.display = "block";
                // Smooth scroll to answer
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion(currentQuestionIndex);
            } else {
                showCelebration();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion(currentQuestionIndex);
            }
        }

        function updateProgress() {
            const percent = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
        }

        function showCelebration() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            
            // Trigger confetti (simulated via simple CSS animation or just UI)
            // For a single file, the UI message serves as the celebration
        }

        // Initialize
        renderQuestion(currentQuestionIndex);
    </script>
</body>
</html>
